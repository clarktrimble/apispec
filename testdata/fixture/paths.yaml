tags:
  - name: widgets
    description: Widget operations

paths:
  /widgets:
    post:
      summary: Create widget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Widget'
      responses:
        '201':
          description: Widget created
    get:
      summary: List widgets
      operationId: listWidgets
      tags:
        - widgets
      responses:
        '200':
          description: Widgets retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Widget'
  /events:
    post:
      summary: Submit events
      requestBody:
        required: true
        description: |
          One event object per line.
          Blank lines are ignored.
        content:
          application/x-ndjson:
            schema:
              type: string
            example: |
              {"event_type":"observations","payload":{"id":"one"}}
              {"event_type":"observations","payload":{"id":"two"}}
          application/json:
            schema:
              type: object
            example:
              event_type: observations
              payload:
                id: one
      responses:
        '202':
          description: Events accepted
    get:
      summary: List events
      operationId: listEvents
      responses:
        '200':
          description: Events retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/EventEnvelope'
                        - type: object
                          properties:
                            event:
                              oneOf:
                                - $ref: '#/components/schemas/Status'
                                - $ref: '#/components/schemas/Audit'
                                - $ref: '#/components/schemas/InventoryAudit'
                                - $ref: '#/components/schemas/Finding'
                                - $ref: '#/components/schemas/Observation'
  /widgets/{id}:
    get:
      summary: Get widget
      operationId: getWidget
      tags:
        - widgets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Widget retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
