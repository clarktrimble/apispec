tags:
  - name: widgets
    description: Widget operations

paths:
  /widgets:
    get:
      summary: List widgets
      operationId: listWidgets
      tags:
        - widgets
      responses:
        '200':
          description: Widgets retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Widget'
  /events:
    get:
      summary: List events
      operationId: listEvents
      responses:
        '200':
          description: Events retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/EventEnvelope'
                        - type: object
                          properties:
                            event:
                              oneOf:
                                - $ref: '#/components/schemas/Status'
                                - $ref: '#/components/schemas/Audit'
                                - $ref: '#/components/schemas/InventoryAudit'
                                - $ref: '#/components/schemas/Finding'
                                - $ref: '#/components/schemas/Observation'
  /widgets/{id}:
    get:
      summary: Get widget
      operationId: getWidget
      tags:
        - widgets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Widget retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
